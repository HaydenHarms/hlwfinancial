<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsroom — HLW Financial</title>

<meta property="og:title" content="Newsroom — HLW Financial">
<meta property="og:description" content="Firm news, insights, and updates from HLW Financial.">
<meta property="og:image" content="https://haydenharms.github.io/hlwfinancial/media/social-preview.jpg">
<meta property="og:image:width" content="1187">
<meta property="og:image:height" content="1200">
<meta property="og:type" content="website">
<meta property="og:url" content="https://haydenharms.github.io/hlwfinancial/news.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Newsroom — HLW Financial">
<meta name="twitter:description" content="Firm news, insights, and updates from HLW Financial.">
<meta name="twitter:image" content="https://haydenharms.github.io/hlwfinancial/media/social-preview.jpg">
<link rel="icon" type="image/svg+xml" href="media/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hlw-chrome.css">
<style>
  :root{
    --green:#1c3524;
    --green-deep:#132518;
    --cream:#f7f5ef;
    --line:#c9c2ae;
    --ink:#1c2b1f;
    --ink-soft:#5a5343;
    --gold:#8a7a3f;
    --panel-bg:#fdfcf8;
    --page-bg:var(--cream);
    --muted:#9a9482;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;overflow-x:hidden;}
  body{
    background:var(--page-bg);color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }

  /* ===== NEWSROOM — a big title, one rule, then every post listed under its month ===== */
  .news-hero{
    max-width:1400px;margin:0 auto;padding:150px 60px 0;
  }
  .news-back{
    display:inline-flex;align-items:center;gap:8px;margin-bottom:30px;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px;
    transition:color .25s ease, border-color .25s ease;
  }
  .news-back:hover{color:var(--ink);border-color:var(--ink);}
  .news-hero h1{
    font-weight:500;font-size:clamp(56px,11vw,168px);line-height:.95;letter-spacing:-.03em;
    color:var(--ink);
  }
  .news-rule{max-width:1400px;margin:44px auto 0;padding:0 60px;}
  .news-rule span{display:block;border-top:1px solid var(--ink);}

  .news-groups{max-width:1400px;margin:0 auto;padding:0 60px 140px;}
  .news-group{
    display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);column-gap:32px;
    padding:56px 0 64px;
  }
  .news-group + .news-group{border-top:1px solid var(--line);}
  .news-group-label{
    font-weight:400;font-size:clamp(26px,3vw,40px);line-height:1.1;letter-spacing:-.01em;color:var(--ink);
    position:sticky;top:110px;align-self:start;
  }
  .news-items{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:32px;row-gap:56px;align-items:start;
  }
  .news-item{opacity:0;transform:translateY(10px);transition:opacity .5s ease, transform .5s ease;}
  .news-item.is-shown{opacity:1;transform:translateY(0);}
  .news-item .date{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--muted);
    margin-bottom:14px;
  }
  .news-item h3{
    font-weight:400;font-size:22px;line-height:1.28;letter-spacing:-.005em;
  }
  .news-item h3 a{color:var(--ink);text-decoration:none;transition:color .25s ease;}
  .news-item h3 a:hover{color:var(--gold);}
  .news-tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin-top:16px;}
  .news-tag{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#6f6230;border:1px solid var(--line);padding:4px 8px;
  }
  .news-read{
    display:inline-flex;align-items:center;gap:6px;margin-top:22px;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;
    color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;
    transition:color .25s ease, border-color .25s ease;
  }
  .news-read:hover{color:var(--ink);border-color:var(--ink);}
  .news-read svg{flex:0 0 auto;}

  .news-empty{
    max-width:1400px;margin:0 auto;padding:56px 60px 140px;
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);
  }

  @media(max-width:1100px){
    .news-items{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media(max-width:900px){
    .news-hero{padding:120px 22px 0;}
    .news-rule{padding:0 22px;margin-top:32px;}
    .news-groups{padding:0 22px 90px;}
    .news-group{grid-template-columns:minmax(0,1fr);row-gap:28px;padding:40px 0 48px;}
    .news-group-label{position:static;}
    .news-empty{padding:40px 22px 90px;}
  }
  @media(max-width:560px){
    .news-items{grid-template-columns:minmax(0,1fr);}
  }
</style>
</head>
<body>

<!-- SITE-WIDE NAV/LOGO PATTERN: keep this exact <header class="site-nav">…<a class="mark">
     block (and its CSS rules .site-nav / .mark / .mark:hover above) identical on every
     page so the logo always links home and gets the same hover "lift" effect. -->
<header class="site-nav" id="siteNav" data-nav-mode="light"></header>

<div class="news-hero">
  <a class="news-back" href="index.html">&larr; Back to home</a>
  <h1>The Newsroom</h1>
</div>
<div class="news-rule"><span></span></div>

<div class="news-groups" id="newsGroups"></div>
<p class="news-empty" id="newsEmpty" hidden>Nothing here yet.</p>

<div class="footer" id="siteFooter"></div>

<div id="gsModalMount"></div>

<script src="hlw-chrome.js"></script>
<script src="hlw-articles.js"></script>
<script>
  // ===== NEWSROOM — every post from hlw-articles.js (newest first), grouped by month + year.
  // hlw-articles.js is generated from the files in /articles (see articles/README.md), and
  // already carries each post's page address, tags and month group. Titles and "Read" links
  // open the post's own page in a new tab. =====
  (function(){
    const root = document.getElementById('newsGroups');
    const emptyMsg = document.getElementById('newsEmpty');
    if(!ARTICLES.length){ emptyMsg.hidden = false; return; }

    const SVG = 'http://www.w3.org/2000/svg';
    function icon(paths, w, h){
      const s = document.createElementNS(SVG, 'svg');
      s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.3');
      s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
      paths.forEach(d => { const p = document.createElementNS(SVG, 'path'); p.setAttribute('d', d); s.appendChild(p); });
      return s;
    }
    const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; };

    // group consecutive posts that share a month + year (the array is newest-first)
    const groups = [];
    ARTICLES.forEach(a => {
      let g = groups[groups.length - 1];
      if(!g || g.key !== a.groupKey){
        g = { key:a.groupKey, label:a.groupLabel, posts:[] };
        groups.push(g);
      }
      g.posts.push(a);
    });

    const items = [];
    groups.forEach(g => {
      const section = el('section', 'news-group');
      section.setAttribute('aria-label', g.label);
      section.appendChild(el('h2', 'news-group-label', g.label));
      const list = el('div', 'news-items');

      g.posts.forEach(a => {
        const href = a.url;
        const item = el('article', 'news-item');
        item.appendChild(el('div', 'date', a.dateNumeric));

        const h3 = el('h3');
        const titleLink = el('a', '', a.title);
        titleLink.href = href; titleLink.target = '_blank'; titleLink.rel = 'noopener';
        h3.appendChild(titleLink);
        item.appendChild(h3);

        const tags = a.tags || [];
        if(tags.length){
          const ul = el('ul', 'news-tags');
          tags.forEach(t => ul.appendChild(el('li', 'news-tag', t)));
          item.appendChild(ul);
        }

        const read = el('a', 'news-read');
        read.href = href; read.target = '_blank'; read.rel = 'noopener';
        read.setAttribute('aria-label', 'Read: ' + a.title + ' (opens in a new tab)');
        read.appendChild(icon(['M2 2v5h6', 'M6 5l2 2-2 2'], 11, 11));
        read.appendChild(document.createTextNode('Read'));
        read.appendChild(icon(['M2.5 8.5l6-6', 'M3.5 2.5h5v5'], 11, 11));
        item.appendChild(read);

        list.appendChild(item);
        items.push(item);
      });

      section.appendChild(list);
      root.appendChild(section);
    });

    // simple staggered reveal on load, matching the rest of the site's entry animations
    items.forEach((item, i) => setTimeout(() => item.classList.add('is-shown'), 80 + i * 60));
  })();
</script>
</body>
</html>
