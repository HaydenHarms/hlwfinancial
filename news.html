<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsroom — HLW Financial</title>

<meta property="og:title" content="Newsroom — HLW Financial">
<meta property="og:description" content="Firm news, insights, and updates from HLW Financial.">
<meta property="og:image" content="https://haydenharms.github.io/hlwfinancial/media/social-preview.jpg">
<meta property="og:image:width" content="1187">
<meta property="og:image:height" content="1200">
<meta property="og:type" content="website">
<meta property="og:url" content="https://haydenharms.github.io/hlwfinancial/news.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Newsroom — HLW Financial">
<meta name="twitter:description" content="Firm news, insights, and updates from HLW Financial.">
<meta name="twitter:image" content="https://haydenharms.github.io/hlwfinancial/media/social-preview.jpg">
<link rel="icon" type="image/svg+xml" href="media/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hlw-chrome.css">
<style>
  :root{
    --green:#1c3524;
    --green-deep:#132518;
    --cream:#f7f5ef;
    --line:#c9c2ae;
    --ink:#1c2b1f;
    --ink-soft:#5a5343;
    --gold:#8a7a3f;
    --panel-bg:#fdfcf8;
    --page-bg:var(--cream);
    --muted:#9a9482;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;overflow-x:hidden;}
  body{
    background:var(--page-bg);color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }

  /* ===== NEWSROOM HEADER — breadcrumb, filter tabs, title block ===== */
  .news-header{
    padding:150px 60px 50px;
    max-width:1400px;margin:0 auto;
  }
  .news-back{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);text-decoration:none;margin-bottom:22px;
    transition:color .25s ease;
  }
  .news-back:hover{color:var(--gold);}
  .news-crumb{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;
    color:var(--muted);margin-bottom:34px;
  }
  .news-crumb a{color:var(--ink-soft);text-decoration:none;}
  .news-crumb a:hover{color:var(--gold);}
  .news-crumb span{color:var(--muted);}

  /* tabs are used inline inside the "Read the Latest" row now, not as
     their own standalone bordered row up top — no bottom border/margin
     of their own here, since .news-latest-head already draws that line */
  .news-tabs{
    display:flex;flex-wrap:wrap;gap:28px;
  }
  .news-tab{
    background:none;border:none;cursor:pointer;padding:0;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;
    color:var(--ink-soft);white-space:nowrap;
    transition:color .25s ease;
  }
  .news-tab:hover{color:var(--ink);}
  .news-tab.is-active{color:var(--green);font-weight:600;}

  .news-title-row h1{
    font-weight:500;font-size:clamp(46px,7vw,96px);line-height:1;letter-spacing:-.01em;
    color:var(--ink);
  }
  .news-title-row h1 em{font-style:italic;color:var(--gold);font-weight:400;}
  .news-title-row p{
    margin-top:22px;font-size:19px;line-height:1.6;color:var(--ink-soft);max-width:560px;
  }

  /* ===== FEATURED STORY — dark placeholder block, mirrors the
     newsroom's real "featured video" slot; centered logo mark stands
     in until there's real footage/imagery to drop in ===== */
  .news-featured{
    max-width:1400px;margin:0 auto;padding:0 60px 30px;
  }
  .news-featured-link{
    display:block;width:100%;text-align:left;
    background:none;border:none;padding:0;margin:0;cursor:pointer;
    font-family:inherit;color:inherit;
  }
  .news-featured-media{
    position:relative;
    height:52vh;min-height:340px;
    background:var(--cream);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .news-featured-media img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center;
  }
  .news-featured-tag{
    position:absolute;top:20px;left:24px;z-index:2;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--cream);background:rgba(19,37,24,0.72);
    padding:6px 12px;border-radius:2px;
  }
  .news-featured-cap{
    padding:24px 2px 0;
    display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;
  }
  .news-featured-cap h2{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;
    font-size:clamp(24px,2.6vw,34px);line-height:1.25;color:var(--green);max-width:720px;
  }
  .news-featured-cap .date{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--muted);
    white-space:nowrap;
  }

  /* ===== "READ THE LATEST" section header — now also hosts the
     category filter tabs, on the right where the arrow used to be ===== */
  .news-latest-head{
    max-width:1400px;margin:70px auto 0;padding:0 60px;
    display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:18px;
  }
  .news-latest-head h3{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;font-size:22px;color:var(--ink);
  }

  /* ===== ARTICLE GRID — same card language as the marquee/product
     cards: thin top accent, hover lift, JetBrains Mono meta text ===== */
  .news-grid{
    max-width:1400px;margin:0 auto;padding:44px 60px 120px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:28px;
  }
  .news-card{
    position:relative;
    border:1px solid var(--line);background:var(--panel-bg);
    text-decoration:none;color:inherit;
    padding:26px 26px 30px;
    transition:transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s cubic-bezier(.16,1,.3,1);
    opacity:0;transform:translateY(14px);
  }
  .news-card.is-shown{opacity:1;transform:translateY(0);}
  .news-card.is-hidden{display:none;}
  @media(hover:hover) and (pointer:fine){
    .news-card:hover{
      transform:translateY(-4px);
      box-shadow:0 18px 36px rgba(19,37,24,0.14);
    }
  }
  .news-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--green);}
  .news-card .meta{
    display:flex;gap:12px;align-items:center;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold);margin-bottom:16px;
  }
  .news-card .meta .date{color:var(--muted);text-transform:none;letter-spacing:.02em;}
  .news-card h4{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;font-size:21px;line-height:1.3;
    color:var(--green);margin-bottom:12px;
  }
  .news-card p{
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;color:var(--ink-soft);
  }

  .news-empty{
    max-width:1400px;margin:0 auto;padding:0 60px 120px;
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);
    display:none;
  }
  .news-empty.is-shown{display:block;}

  /* ===== ARTICLE READER — dimmed scrim behind, a centered reading
     panel in front (not a full-screen takeover). Same open/close
     pattern as the Get Started panel (scrim click, close button,
     Escape), but a centered scale/fade instead of a side slide-in,
     since this is "opening up" an article rather than a form. ===== */
  .article-overlay{
    position:fixed;inset:0;z-index:250;
    display:flex;align-items:center;justify-content:center;
    padding:40px 24px;
    visibility:hidden;
    transition:visibility 0s linear .4s;
  }
  .article-overlay.is-open{visibility:visible;transition-delay:0s;}
  .article-scrim{
    position:absolute;inset:0;
    background:rgba(11,18,13,0.62);
    opacity:0;transition:opacity .4s ease;
  }
  .article-overlay.is-open .article-scrim{opacity:1;}
  .article-panel{
    position:relative;z-index:2;
    width:100%;max-width:720px;max-height:85vh;overflow-y:auto;
    background:var(--panel-bg);border:1px solid var(--line);
    box-shadow:0 40px 90px rgba(11,18,13,0.35);
    padding:52px 52px 60px;
    opacity:0;transform:translateY(18px) scale(.97);
    transition:opacity .4s cubic-bezier(.2,.7,.3,1), transform .4s cubic-bezier(.2,.7,.3,1);
  }
  .article-overlay.is-open .article-panel{opacity:1;transform:translateY(0) scale(1);}
  .article-panel::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--green);}
  .article-close{
    position:absolute;top:22px;right:24px;
    background:none;border:none;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);padding:4px;
    transition:color .3s ease;
  }
  .article-close:hover{color:var(--gold);}
  .article-panel .meta{
    display:flex;gap:12px;align-items:center;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold);margin-bottom:20px;padding-right:60px;
  }
  .article-panel .meta .date{color:var(--muted);text-transform:none;letter-spacing:.02em;}
  .article-panel h2{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;
    font-size:clamp(26px,3vw,36px);line-height:1.2;color:var(--green);margin-bottom:26px;
  }
  .article-panel .body p{
    font-size:16px;line-height:1.75;color:var(--ink-soft);margin-bottom:18px;
  }
  .article-panel .body p:last-child{margin-bottom:0;}

  @media(max-width:640px){
    .article-panel{padding:60px 26px 40px;max-height:88vh;}
  }

  @media(max-width:900px){
    .news-header{padding:120px 22px 40px;}
    .news-tabs{gap:18px;}
    .news-featured{padding:0 22px 24px;}
    .news-latest-head{padding:0 22px;margin-top:50px;}
    .news-grid{padding:36px 22px 80px;grid-template-columns:1fr;gap:20px;}
  }
</style>
</head>
<body>

<!-- SITE-WIDE NAV/LOGO PATTERN: keep this exact <header class="site-nav">…<a class="mark">
     block (and its CSS rules .site-nav / .mark / .mark:hover above) identical on every
     page so the logo always links home and gets the same hover "lift" effect. -->
<header class="site-nav" id="siteNav" data-nav-mode="light"></header>

<div class="news-header">
  <a href="index.html" class="news-back">← Back</a>
  <div class="news-crumb"><a href="index.html">HLW Financial</a> <span>/ Newsroom</span></div>

  <div class="news-title-row">
    <h1>The <em>Newsroom.</em></h1>
    <p>Firm news, tax and regulatory insights, and updates from HLW Financial.</p>
  </div>
</div>

<div class="news-featured">
  <button class="news-featured-link" id="newsFeaturedLink" type="button">
    <div class="news-featured-media">
      <img src="media/hlwinitials.PNG" alt="HLW Financial — Harms, Lindsey, Wigley">
      <div class="news-featured-tag">Featured</div>
    </div>
    <div class="news-featured-cap">
      <h2 id="newsFeaturedTitle"></h2>
      <span class="date" id="newsFeaturedMeta"></span>
    </div>
  </button>
</div>

<div class="news-latest-head">
  <h3>Read the Latest</h3>
  <div class="news-tabs" id="newsTabs">
    <button class="news-tab is-active" data-filter="all">All</button>
    <button class="news-tab" data-filter="firm">Firm News</button>
    <button class="news-tab" data-filter="insights">Insights</button>
  </div>
</div>

<div class="news-grid" id="newsGrid"></div>
<p class="news-empty" id="newsEmpty">Nothing in this category yet.</p>

<div class="article-overlay" id="articleOverlay">
  <div class="article-scrim" id="articleScrim"></div>
  <div class="article-panel">
    <button class="article-close" id="articleClose" type="button">Close ✕</button>
    <div class="meta"><span id="articleCategory"></span><span class="date" id="articleDate"></span></div>
    <h2 id="articleTitle"></h2>
    <div class="body" id="articleBody"></div>
  </div>
</div>

<div class="footer" id="siteFooter"></div>

<div id="gsModalMount"></div>

<script src="hlw-chrome.js"></script>
<script>
  // ===== NEWSROOM ARTICLES — single source of truth. To add a new
  // article later: duplicate one object below with a new id/content —
  // the card grid, the featured slot (if you flag one), and the reader
  // panel all render from this same data, so nothing else needs to
  // change by hand. =====
  const ARTICLES = [
    {
      id: 'founding-clients',
      category: 'Firm News',
      filterKey: 'firm',
      date: 'Aug 2026',
      title: 'Taking a small number of founding clients — at a discount, in exchange for real feedback.',
      excerpt: 'A limited number of engagements at a discounted rate, for business owners willing to help shape how we build the firm\u2019s tools and workflows.',
      featured: true,
      body: [
        'HLW Financial is opening a limited number of founding-client engagements at a discounted rate \u2014 for business owners willing to work closely with us while we build out the firm\u2019s tools and workflows.',
        'In practice, that means shorter feedback loops than a typical client relationship: you\u2019ll see draft reports before they\u2019re finalized, weigh in on how your dashboard is organized, and flag what\u2019s confusing or missing as we go. Nothing experimental touches your actual filings \u2014 the discount is for your time and input, not for cutting corners on the work itself.',
        'Spots are limited, and we\u2019re prioritizing businesses whose books need to get current \u2014 bookkeeping, tax prep, or both. If that sounds like you, reach out through Get Started and mention you\u2019re interested in the founding-client rate.'
      ]
    }
  ];

  // ===== render cards from ARTICLES =====
  (function(){
    const grid = document.getElementById('newsGrid');
    const emptyMsg = document.getElementById('newsEmpty');

    function cardHTML(a){
      return '<a href="#" class="news-card" data-id="' + a.id + '" data-category="' + a.filterKey + '">' +
        '<div class="meta"><span>' + a.category + '</span><span class="date">' + a.date + '</span></div>' +
        '<h4>' + a.title + '</h4>' +
        '<p>' + a.excerpt + '</p>' +
      '</a>';
    }
    grid.innerHTML = ARTICLES.map(cardHTML).join('');

    // featured slot — first article flagged featured:true
    const featured = ARTICLES.find(a => a.featured) || ARTICLES[0];
    if(featured){
      document.getElementById('newsFeaturedTitle').textContent = featured.title;
      document.getElementById('newsFeaturedMeta').textContent = featured.date + ' · ' + featured.category;
      document.getElementById('newsFeaturedLink').dataset.id = featured.id;
    }

    if(!ARTICLES.length) emptyMsg.classList.add('is-shown');
  })();

  // ===== ARTICLE READER — dimmed scrim behind, centered panel in
  // front. Opens on any card click or the featured block, populated
  // from the matching ARTICLES entry. =====
  (function(){
    const overlay = document.getElementById('articleOverlay');
    const scrim = document.getElementById('articleScrim');
    const closeBtn = document.getElementById('articleClose');
    if(!overlay) return;

    function openArticle(id){
      const a = ARTICLES.find(x => x.id === id);
      if(!a) return;
      document.getElementById('articleCategory').textContent = a.category;
      document.getElementById('articleDate').textContent = a.date;
      document.getElementById('articleTitle').textContent = a.title;
      document.getElementById('articleBody').innerHTML = a.body.map(p => '<p>' + p + '</p>').join('');
      overlay.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closeArticle(){
      overlay.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    // delegated click — covers cards (re-rendered dynamically) and the
    // featured block without needing to rebind listeners after render
    document.addEventListener('click', function(e){
      const card = e.target.closest('.news-card');
      const featured = e.target.closest('#newsFeaturedLink');
      if(card){
        e.preventDefault();
        openArticle(card.dataset.id);
      } else if(featured){
        e.preventDefault();
        openArticle(featured.dataset.id);
      }
    });

    scrim.addEventListener('click', closeArticle);
    closeBtn.addEventListener('click', closeArticle);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') closeArticle();
    });
  })();

  // ===== NEWSROOM — category tab filtering + card reveal on load =====
  (function(){
    const tabs = document.querySelectorAll('#newsTabs .news-tab');
    const emptyMsg = document.getElementById('newsEmpty');

    function applyFilter(filter){
      const cards = document.querySelectorAll('#newsGrid .news-card');
      let visibleCount = 0;
      cards.forEach(card=>{
        const match = filter === 'all' || card.dataset.category === filter;
        card.classList.toggle('is-hidden', !match);
        if(match) visibleCount++;
      });
      emptyMsg.classList.toggle('is-shown', visibleCount === 0);
    }

    tabs.forEach(tab=>{
      tab.addEventListener('click', ()=>{
        tabs.forEach(t=>t.classList.remove('is-active'));
        tab.classList.add('is-active');
        applyFilter(tab.dataset.filter);
      });
    });

    // simple staggered reveal on load, matching the rest of the site's
    // scroll/entry animations rather than snapping straight in
    document.querySelectorAll('#newsGrid .news-card').forEach((card, i)=>{
      setTimeout(()=> card.classList.add('is-shown'), 80 + i * 60);
    });
  })();
</script>

</body>
</html>
