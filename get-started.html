<link rel="stylesheet" href="hlw-chrome.css">
<style>
  :root{
    --green:#1c3524;
    --green-deep:#132518;
    --cream:#f7f5ef;
    --line:#c9c2ae;
    --ink:#1c2b1f;
    --ink-soft:#5a5343;
    --gold:#8a7a3f;
    --panel-bg:#fdfcf8;
    --page-bg:var(--cream);
    --muted:#9a9482;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;overflow-x:hidden;}
  body{
    background:var(--page-bg);color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    transition:background .35s ease, color .35s ease;
  }

  /* ===== SITE-WIDE NAV/LOGO PATTERN — identical to index.html ===== */
  /* Get Started — same button shape as Client Access, distinguished by
     color (gold fill vs. green) so it reads as the primary action */
  /* ===== COMING SOON — centered, same typographic language as the hero ===== */
  .coming-soon{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:0 60px;
  }
  .coming-soon .eyebrow{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);margin-bottom:26px;
  }
  .coming-soon .eyebrow::before, .coming-soon .eyebrow::after{content:"";width:28px;height:1px;background:var(--gold);}
  .coming-soon h1{
    font-weight:500;font-size:clamp(38px,6vw,72px);line-height:1.1;letter-spacing:-.01em;
    max-width:820px;margin:0 auto;
  }
  .coming-soon h1 em{font-style:italic;color:var(--gold);font-weight:400;}
  .coming-soon p{
    margin:26px auto 0;font-size:17px;line-height:1.7;color:var(--ink-soft);max-width:440px;
  }
  .coming-soon .back{
    display:inline-block;margin-top:44px;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px;
    transition:color .3s ease, border-color .3s ease;
  }
  .coming-soon .back:hover{color:var(--gold);border-color:var(--gold);}

  /* ===== FOOTER — identical to index.html ===== */

  @media(max-width:900px){
    .coming-soon{padding:0 22px;}
  }

  /* ===== GET STARTED — slide-in panel form, modeled on Palantir's
     contact/get-started split-panel: dark scrim over the page, a light
     panel from the right with plain underline inputs (no boxes), a
     small caps label above each field. Opens from the nav's Get
     Started button and every "let's talk" link, on every page. ===== */

  @media(max-width:640px){
  }

</style>
</head>
<body>

<!-- SITE-WIDE NAV/LOGO PATTERN: keep this exact <header class="site-nav">…<a class="mark">
     block (and its CSS rules .site-nav / .mark / .mark:hover above) identical on every
     page so the logo always links home and gets the same hover "lift" effect. -->
<header class="site-nav" id="siteNav" data-nav-mode="light"></header>

<section class="coming-soon">
  <div>
    <div class="eyebrow">Get Started</div>
    <h1>Coming <em>Soon.</em></h1>
    <p>A guided start for new clients is on its way. In the meantime, reach out directly and we'll be in touch.</p>
    <a href="index.html" class="back">Back to Home</a>
  </div>
</section>

<div class="footer" id="siteFooter"></div>


<!-- ===== GET STARTED — slide-in panel, modeled on Palantir's contact
     form: dark scrim + light panel from the right, plain underline
     inputs, no boxes. Opens from the nav's Get Started button and
     every "let's talk" link. Same block, unchanged, on every page. ===== -->
<div id="gsModalMount"></div>

<script src="hlw-chrome.js"></script>

</body>
</html>
