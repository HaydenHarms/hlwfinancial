<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Demo — HLW Financial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#8fb89a;
    --green-deep:#0b120d;
    --cream:#eef0e9;
    --line:#33402f;
    --ink:#e9ebe2;
    --ink-soft:#a3ab97;
    --gold:#c9ab5f;
    --panel-bg:#12180f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--green-deep);color:var(--ink);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .cta{
    position:relative;overflow:hidden;
    padding:120px 60px 130px;
  }

  /* faint structural grid — same operational language as the ledger readout below */
  .cta::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(90deg, var(--line) 1px, transparent 1px),
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size:calc((100% - 120px)/6) 64px;
    background-position:60px 0, 60px 0;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, black 0%, transparent 75%);
    mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, black 0%, transparent 75%);
  }

  .cta-inner{position:relative;z-index:2;max-width:1400px;margin:0 auto;}

  .cta-status{
    display:flex;align-items:center;justify-content:space-between;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);
    padding-bottom:56px;margin-bottom:56px;border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(10px);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.3,1);
  }
  .cta.is-visible .cta-status{opacity:1;transform:translateY(0);}
  .cta-status .dot-row{display:flex;align-items:center;gap:10px;}
  .cta-status .dot{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(143,184,154,.5);
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(143,184,154,.45);}
    70%{box-shadow:0 0 0 8px rgba(143,184,154,0);}
    100%{box-shadow:0 0 0 0 rgba(143,184,154,0);}
  }

  .cta h2{
    font-weight:500;font-size:clamp(34px,4.4vw,58px);line-height:1.12;letter-spacing:-.01em;
    max-width:700px;
    opacity:0;transform:translateY(16px);
    transition:opacity .8s ease .05s, transform .8s cubic-bezier(.2,.7,.3,1) .05s;
  }
  .cta.is-visible h2{opacity:1;transform:translateY(0);}
  .cta h2 em{font-style:italic;color:var(--gold);font-weight:400;}

  .cta-body{
    margin-top:70px;
    display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;
  }

  /* ===== SIGNATURE ELEMENT — typed ledger status readout ===== */
  .ledger{
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:2.5;color:var(--ink-soft);
  }
  .ledger .row{
    display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;
    white-space:nowrap;
  }
  .ledger .row .label{color:var(--ink);opacity:0;}
  .ledger .row .dots{overflow:hidden;color:var(--line);}
  .ledger .row .dots i{font-style:normal;}
  .ledger .row .val{color:var(--gold);opacity:0;flex-shrink:0;}
  .ledger .caret{
    display:inline-block;width:7px;height:14px;background:var(--gold);
    vertical-align:-2px;animation:caretBlink 1s step-end infinite;
  }
  @keyframes caretBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

  .cta-actions{display:flex;flex-direction:column;align-items:flex-start;gap:26px;}

  .cta-btn{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:12px;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--cream);background:transparent;
    border:1px solid var(--gold);padding:18px 32px;
    text-decoration:none;cursor:pointer;
    opacity:0;transform:translateY(14px);
    transition:opacity .8s ease .15s, transform .8s cubic-bezier(.2,.7,.3,1) .15s;
  }
  .cta.is-visible .cta-btn{opacity:1;transform:translateY(0);}
  .cta-btn::before{
    content:"";position:absolute;inset:0;background:var(--gold);
    transform:translateX(-101%);transition:transform .45s cubic-bezier(.65,0,.35,1);
    z-index:0;
  }
  .cta-btn:hover::before{transform:translateX(0);}
  .cta-btn span, .cta-btn svg{position:relative;z-index:1;transition:color .45s ease;}
  .cta-btn:hover span{color:var(--green-deep);}
  .cta-btn:hover svg{stroke:var(--green-deep);}
  .cta-btn svg{transition:transform .45s cubic-bezier(.65,0,.35,1), stroke .45s ease;}
  .cta-btn:hover svg{transform:translateX(4px);}

  .cta-ghost{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px;
    transition:color .3s ease, border-color .3s ease;
    opacity:0;transform:translateY(14px);
    transition:opacity .8s ease .25s, transform .8s cubic-bezier(.2,.7,.3,1) .25s, color .3s ease, border-color .3s ease;
  }
  .cta.is-visible .cta-ghost{opacity:1;transform:translateY(0);}
  .cta-ghost:hover{color:var(--gold);border-color:var(--gold);}

  @media (max-width:860px){
    .cta{padding:80px 22px 90px;}
    .cta-status{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:40px;margin-bottom:40px;}
    .cta-body{grid-template-columns:1fr;gap:44px;}
    .ledger .row{grid-template-columns:auto 1fr auto;}
  }

  /* just page chrome for the demo, not part of the deliverable */
  .demo-note{
    max-width:1400px;margin:40px auto 0;padding:0 60px 60px;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--ink-soft);
    border-top:1px solid var(--line);padding-top:24px;
  }
</style>
</head>
<body>

<section class="cta" id="ctaSection">
  <div class="cta-inner">

    <div class="cta-status">
      <div class="dot-row"><span class="dot"></span> Accepting New Engagements</div>
      <div>Dallas, Texas</div>
    </div>

    <h2>Let's put your books<br>on a <em>better cadence.</em></h2>

    <div class="cta-body">
      <div class="ledger" id="ledger"><!-- typed in by JS --></div>

      <div class="cta-actions">
        <a href="#" class="cta-btn">
          <span>Request an Introduction</span>
          <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 5h13M9 1l5 4-5 4"/></svg>
        </a>
        <a href="#" class="cta-ghost">View Our Approach</a>
      </div>
    </div>

  </div>
</section>

<div class="demo-note">
  Demo preview only — not yet wired into index.html. Scroll away and back to replay the reveal.
</div>

<script>
  const rows = [
    { label: 'Books Reconciled', value: 'Daily' },
    { label: 'Returns Filed',    value: 'On Time' },
    { label: 'Advisory Review',  value: 'Monthly' }
  ];
  const ledgerEl = document.getElementById('ledger');
  let typed = false;

  function buildDots(label, value){
    // rough dot-leader length so it reads like a typeset ledger line
    const used = label.length + value.length;
    const count = Math.max(6, 46 - used);
    return '.'.repeat(count);
  }

  function typeLedger(){
    if(typed) return;
    typed = true;
    ledgerEl.innerHTML = '';
    rows.forEach((r, i)=>{
      const row = document.createElement('div');
      row.className = 'row';
      const dotsFull = buildDots(r.label, r.value);
      row.innerHTML = `<span class="label">${r.label}</span><span class="dots"><i></i></span><span class="val">${r.value}</span>`;
      ledgerEl.appendChild(row);

      const labelEl = row.querySelector('.label');
      const dotsEl = row.querySelector('.dots i');
      const valEl = row.querySelector('.val');
      const delay = i * 650;

      setTimeout(()=>{
        labelEl.style.opacity = 1;
        // type the dot leader out character by character
        let n = 0;
        const dotInterval = setInterval(()=>{
          n++;
          dotsEl.textContent = dotsFull.slice(0, n);
          if(n >= dotsFull.length){
            clearInterval(dotInterval);
            valEl.style.opacity = 1;
          }
        }, 12);
      }, delay);
    });

    // blinking caret at the very end, after the last row types in
    setTimeout(()=>{
      const caret = document.createElement('span');
      caret.className = 'caret';
      ledgerEl.appendChild(caret);
    }, rows.length * 650 + 500);
  }

  const section = document.getElementById('ctaSection');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        section.classList.add('is-visible');
        setTimeout(typeLedger, 300);
      }
    });
  }, {threshold:0.3});
  io.observe(section);
</script>

</body>
</html>
