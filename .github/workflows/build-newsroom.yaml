# Rebuilds the newsroom whenever a post (or the build script) changes.
#   articles/*.md  ->  newsroom/<post>.html + hlw-articles.js
# The site keeps publishing from the main branch exactly as before; this just commits the
# generated files. If a post has a mistake the build stops, nothing is published from it,
# and the run shows up as a red X in the repo's Actions tab with a plain-English reason.
name: Build newsroom

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/build-articles.js'
  workflow_dispatch:        # lets you run it by hand: Actions tab -> Build newsroom -> Run workflow

permissions:
  contents: write

concurrency:
  group: build-newsroom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build articles
        run: node scripts/build-articles.js

      - name: Commit the generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hlw-articles.js newsroom
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build newsroom"
            git push
          fi
